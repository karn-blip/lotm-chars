<style>

// Split each 10-option question into smaller, more focused screens
const CHUNK_SIZE = 5;
function buildQuestions(raw){
  const out = [];
  raw.forEach(rq => {
    const opts = rq.opts;
    const parts = [];
    for (let i = 0; i < opts.length; i += CHUNK_SIZE) parts.push(opts.slice(i, i + CHUNK_SIZE));
    parts.forEach((p, idx) => {
      out.push({
        q: rq.q,
        part: parts.length > 1 ? (idx + 1) + " of " + parts.length : null,
        opts: p
      });
    });
  });
  return out;
}

let current = 0;
const scores = {klein:0, audrey:0, alger:0, derrick:0, fors:0, cattleya:0, gehrman:0, emlyn:0, leonard:0, xio:0};

function startQuiz(){
  document.getElementById('screen-landing').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  buildTrack();
  renderQuestion();
}

function buildTrack(){
  const track = document.getElementById('seqTrack');
  track.innerHTML = '';
  for(let i=0;i<questions.length;i++){
    const d = document.createElement('div');
    d.className = 'seq-dot';
    d.id = 'dot-'+i;
    track.appendChild(d);
  }
}

function renderQuestion(){
  const q = questions[current];
  const themeIndex = Math.floor(current / 2);
  document.getElementById('themeIcon').innerHTML = themeIcons[themeIndex] || themeIcons[themeIcons.length - 1];
  for(let i=0;i<questions.length;i++){
    document.getElementById('dot-'+i).classList.toggle('filled', i < current);
  }
  document.getElementById('qPart').textContent = q.part ? "Part " + q.part : "";
  document.getElementById('qText').textContent = q.q;
  const optWrap = document.getElementById('qOptions');
  optWrap.innerHTML = '';
  q.opts.forEach(([label, key]) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = label;
    b.onclick = () => selectOption(key);
    optWrap.appendChild(b);
  });
}

function selectOption(key){
  scores[key]++;
  current++;
  if(current >= questions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult(){
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.remove('hidden');
  let winner = 'klein';
  let best = -1;
  for(const key in scores){
    if(scores[key] > best){ best = scores[key]; winner = key; }
  }
  const c = characters[winner];
  document.getElementById('resultName').textContent = c.name;
  document.getElementById('resultEpithet').textContent = c.epithet;
  document.getElementById('resultDesc').textContent = c.desc;
  document.getElementById('resultQuote').textContent = c.quote;
  const img = document.getElementById('resultImg');
  img.src = c.image;
  img.alt = c.name;
}

function restart(){
  current = 0;
  for(const k in scores) scores[k] = 0;
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-landing').classList.remove('hidden');
}
